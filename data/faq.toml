## 자주 묻는 질문 데이터. 문항 4개(위치·영업시간·연락 방법·가격대), 템플릿은 layouts/home.html에서 순회한다.

[[items]]
question = "낙성대 노래빠 라비 위치를 알고 싶어요"
answer = "라비는 서울 관악구 봉천동, 낙성대역 인근에 자리하고 있습니다. 정확한 위치는 지도를 참고해 주세요."

[[items]]
question = "낙성대 노래빠 라비는 언제 문을 여나요?"
answer = "라비의 영업시간은 18:00부터 다음날 15:00까지이며 매일 동일합니다."

[[items]]
question = "낙성대 노래빠 라비 예약 문의는 어디로 하나요?"
answer = "낙성대 라비 예약은 전화 010-7456-5410, 텔레그램 ggyuvely로 가능합니다."

[[items]]
question = "낙성대 노래빠 라비 가격대가 궁금합니다"
answer = "라비 요금은 1인 100,000원, 2인 160,000원, 3인 240,000원, 4인 320,000원부터 시작하며 정확한 금액은 예약 시 확인해 주세요."
