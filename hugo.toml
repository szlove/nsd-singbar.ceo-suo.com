baseURL = 'https://nsd-singbar.ceo-suo.com/'
languageCode = 'ko-KR'
title = '낙성대 노래빠 라비 — LAVI'

[params]
  isAdsEnabled = true
  adsTelegramId = "ggyuvely"

  description = '낙성대 노래빠 라비(LAVI)는 노래 반주 시설을 갖춘 룸형 주점입니다. 영업은 매일 저녁 여섯 시에 시작해 다음날 오후 세 시에 마칩니다. 인원별 요금은 1인 10만원, 2인 16만원, 3인 24만원, 4인 32만원입니다. 예약 문의는 전화 상담으로 이루어집니다.'
  author = '라비'
  datePublished = "2026-08-18T08:50:00+09:00"
  dateModified = "2026-08-18T08:50:00+09:00"
  [params.store]
	tel = "010-7456-5410"
  location = "낙성대"
	locationEn = "NSD"
  name = "라비"
	nameEn = "LAVI"
	nameIs = "는"
	category = "노래빠"
	categoryEn = "Singbar"
	categoryIs = "는"
	address = "서울 관악구 봉천동"
	googleMapSrc = "https://www.google.com/maps?q=서울+관악구+봉천동&output=embed"

enableRobotsTXT = false
cleanDestinationDir = true

[build]
  [build.buildStats]
    enable = true
  [[build.cachebusters]]
    source = 'assets/notwatching/hugo_stats\.json'
    target = 'css'
  [[build.cachebusters]]
    source = '(postcss|tailwind)\.config\.js'
    target = 'css'
[module]
  [[module.mounts]]
    source = 'assets'
    target = 'assets'
  [[module.mounts]]
    disableWatch = true
    source = 'hugo_stats.json'
    target = 'assets/notwatching/hugo_stats.json'

[caches]
  [caches.images]
    dir = ':cacheDir/images'
